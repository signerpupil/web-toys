<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PUPIL Preview Admin</title>
<link rel="icon" type="image/png" href="icon128.png">
<style>
:root{--blue:#1B7DB7;--ink:#1B1B1B;--mute:#6A6A6A;--line:#E2E2E2;--bg:#F1F1F1;--err:#B42318}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif;padding:16px}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px rgba(16,24,40,.08),0 6px 20px rgba(16,24,40,.06);padding:26px 24px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--mute);font-size:14px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
input[type=password]{width:100%;height:40px;border:1px solid #c9d1d9;border-radius:8px;padding:0 12px;font:inherit}
input[type=password]:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(27,125,183,.18)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--ink)}
button{width:100%;height:40px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>

</form>

  const K = 'ppvAdminKey';
  const u8 = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
  const b64 = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const store = { get: () => { try { return localStorage.getItem(K); } catch (e) { return null; } },
    set: (v) => { try { localStorage.setItem(K, v); } catch (e) { /* egal */ } },
    del: () => { try { localStorage.removeItem(K); } catch (e) { /* egal */ } } };
  if (/[?&]abmelden\b/.test(location.search)) { store.del(); history.replaceState(null, '', location.pathname); }
  const zeigen = async (key) => {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  };
  // Gemerkter Schluessel (gilt nur fuer diese Seitenversion; nach Passwortwechsel ungueltig)
  const saved = store.get();
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.salt === D.salt) { await zeigen(await crypto.subtle.importKey('raw', u8(s.k), 'AES-GCM', false, ['decrypt'])); return; }
    } catch (e) { /* ungueltig -> neu anmelden */ }
    store.del();
  }
  const f = document.getElementById('f'); f.hidden = false;
  document.getElementById('pw').focus();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      const raw = await crypto.subtle.exportKey('raw', key);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct)); // prueft das Passwort
      if (document.getElementById('merken').checked) store.set(JSON.stringify({ salt: D.salt, k: b64(raw) }));
      await zeigen(key);
    } catch (x) {
      err.textContent = 'Passwort falsch.'; go.disabled = false;
    }
  });
})();
